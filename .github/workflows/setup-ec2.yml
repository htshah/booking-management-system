name: Setup EC2 Instance

on:
  workflow_dispatch:
    inputs:
      hostname:
        description: "EC2 host to connect to (defaults to the EC2_HOST secret)"
        required: false
        default: ""
      repo_url:
        description: "Git URL to clone (defaults to this repo over HTTPS)"
        required: false
        default: "https://github.com/htshah/booking-management-system.git"

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Bootstrap EC2 over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ inputs.hostname != '' && inputs.hostname || secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT || 22 }}
          envs: REPO_URL,PROJECT_PATH
          script: |
            set -euo pipefail

            # Install git, curl and Docker Engine via the distro's package manager.
            if command -v dnf >/dev/null 2>&1; then
              sudo dnf update -y
              sudo dnf install -y git curl docker
            elif command -v apt-get >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install -y git curl docker.io
            else
              echo "Unsupported distro: no dnf or apt-get found" >&2
              exit 1
            fi

            sudo systemctl enable --now docker

            # Let the SSH user run docker without sudo.
            if ! groups "$USER" | grep -qw docker; then
              sudo usermod -aG docker "$USER"
            fi

            # Install the Docker Compose v2 CLI plugin if it's missing.
            if ! docker compose version >/dev/null 2>&1; then
              ARCH=$(uname -m | sed 's/x86_64/x86_64/;s/aarch64/aarch64/')
              sudo mkdir -p /usr/libexec/docker/cli-plugins
              sudo curl -SL "https://github.com/docker/compose/releases/latest/download/docker-compose-linux-${ARCH}" \
                -o /usr/libexec/docker/cli-plugins/docker-compose
              sudo chmod +x /usr/libexec/docker/cli-plugins/docker-compose
            fi

            # Install the Docker Buildx CLI plugin if it's missing.
            if ! docker buildx version >/dev/null 2>&1; then
              ARCH=$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')
              mkdir -p ~/.docker/cli-plugins
              BUILDX_URL=$(curl -s https://api.github.com/repos/docker/buildx/releases/latest \
                | grep "browser_download_url.*linux-${ARCH}\"" | cut -d '"' -f 4)
              curl -L "$BUILDX_URL" -o ~/.docker/cli-plugins/docker-buildx
              chmod +x ~/.docker/cli-plugins/docker-buildx
            fi

            docker compose version
            docker buildx version

            # Clone the repo if it isn't already there, otherwise leave it for the deploy workflow.
            PROJECT_PATH="${PROJECT_PATH:-$HOME/booking-management-system}"
            if [ ! -d "$PROJECT_PATH/.git" ]; then
              git clone "$REPO_URL" "$PROJECT_PATH"
            else
              echo "$PROJECT_PATH already exists, skipping clone"
            fi
        env:
          REPO_URL: ${{ inputs.repo_url }}
          PROJECT_PATH: ${{ secrets.EC2_PROJECT_PATH }}
